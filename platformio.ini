; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino

; Set monitor speed for serial communication output
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Prevent opening the serial monitor from resetting the T-Display.
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    robtillaart/INA238 @ ^0.1.3
    adafruit/Adafruit BMP280 Library @ ^2.2.4
    bodmer/TFT_eSPI @ ^2.5.43

; TTGO T-Display ST7789 via build flags; no User_Setup.h edit.
; Matches the library's official Setup25_TTGO_T_Display.h.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_SDA_READ=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

